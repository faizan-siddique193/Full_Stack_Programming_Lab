<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Quiz</title>
    <link rel="stylesheet" href="quiz.css" />
  </head>
  <body>
    <div class="container">
      <h1>Quiz</h1>

      <div class="question">
        <p>1. What is the capital of France?</p>
        <input type="text" id="q1" placeholder="Your answer" />
      </div>

      <div class="question">
        <p>2. What is 5 + 7?</p>
        <input type="text" id="q2" placeholder="Your answer" />
      </div>

      <div class="question">
        <p>3. What planet is known as the Red Planet?</p>
        <input type="text" id="q3" placeholder="Your answer" />
      </div>

      <div class="question">
        <p>4. How many days are in a week?</p>
        <input type="text" id="q4" placeholder="Your answer" />
      </div>

      <div class="question">
        <p>5. What is the largest ocean on Earth?</p>
        <input type="text" id="q5" placeholder="Your answer" />
      </div>

      <div class="buttons">
        <button id="submitBtn">Submit Quiz</button>
        <button id="resetBtn">Reset Quiz</button>
      </div>

      <div id="results"></div>
    </div>

    <script src="quiz.js"></script>
  </body>
</html>
